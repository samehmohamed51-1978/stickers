<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>استوديو الاستيكرات المنفردة</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;900&family=Tajawal:wght@700;900&family=Changa:wght@700&display=swap" rel="stylesheet">
    <style>
        @page {
            size: A4 portrait;
            margin: 10mm;
        }
        body {
            font-family: 'Cairo', Tahoma, sans-serif;
            background-color: #0f172a;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #f8fafc;
        }
        .control-panel {
            background: #1e293b;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            max-width: 900px;
            width: 100%;
            margin-bottom: 25px;
            border: 1px solid #334155;
        }
        .control-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        .control-group label {
            font-size: 12px;
            font-weight: bold;
            color: #94a3b8;
        }
        input[type="text"], select, input[type="color"], input[type="range"] {
            padding: 8px 12px;
            border: 1px solid #475569;
            background: #0f172a;
            color: white;
            border-radius: 6px;
            font-family: 'Cairo', Tahoma, sans-serif;
        }
        .print-btn {
            background: #16a34a;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            font-size: 15px;
            font-family: 'Cairo', Tahoma, sans-serif;
            grid-column: 1 / -1;
            transition: background 0.2s;
        }
        .print-btn:hover { background: #15803d; }

        /* كل استيكر أصبح صفحة A4 منفصلة بذاته */
        .page {
            width: 190mm;
            height: 275mm;
            background: white;
            display: flex;
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
            box-shadow: 0 0 20px rgba(0,0,0,0.3);
            margin-bottom: 30px;
            page-break-after: always;
            border-radius: 15px;
            padding: 10mm;
        }
        
        .sticker {
            width: 100%;
            height: 100%;
            border-radius: 12px;
            overflow: hidden;
            position: relative;
            box-sizing: border-box;
            border: 3px dashed #64748b;
            background-size: cover;
            background-position: center;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .content {
            position: absolute;
            top: 0; right: 0; bottom: 0; left: 0;
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: space-around;
            z-index: 2;
        }

        .avatar-container {
            width: 75mm;
            height: 75mm;
            border-radius: 50%;
            border: 5px solid #ffffff;
            box-shadow: 0 8px 25px rgba(0,0,0,0.4);
            overflow: hidden;
            background: #ffffff;
            flex-shrink: 0;
        }
        
        .avatar-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .text-box {
            text-align: right;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 15px;
        }

        .student-name {
            font-weight: 900;
            margin: 0;
            line-height: 1.1;
            transition: all 0.1s;
        }

        .grade-badge {
            display: inline-block;
            font-weight: 900;
            padding: 8px 25px;
            border-radius: 12px;
            text-align: center;
            align-self: flex-end;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            transition: all 0.1s;
        }

        @media print {
            body { background: none; padding: 0; }
            .control-panel { display: none; }
            .page { box-shadow: none; margin: 0; page-break-after: always; }
        }
    </style>
</head>
<body>

<div class="control-panel">
    <div class="control-group">
        <label>اسم الطفل:</label>
        <input type="text" id="nameInput" value="MOHAMED SAMEH" oninput="updateStyles()">
    </div>
    <div class="control-group">
        <label>الفصل / المرحلة:</label>
        <input type="text" id="gradeInput" value="G 4B" oninput="updateStyles()">
    </div>
    <div class="control-group">
        <label>نوع الخط:</label>
        <select id="fontFamily" onchange="updateStyles()">
            <option value="'Cairo', sans-serif">Cairo (عصري)</option>
            <option value="'Tajawal', sans-serif">Tajawal (رسمي)</option>
            <option value="'Changa', sans-serif">Changa (عريض)</option>
        </select>
    </div>
    <div class="control-group">
        <label>حجم خط الاسم: <span id="nameSizeVal">28</span>pt</label>
        <input type="range" id="nameSize" min="18" max="45" value="28" oninput="updateStyles()">
    </div>
    <div class="control-group">
        <label>سماكة الحدود البيضاء: <span id="strokeSizeVal">2</span>px</label>
        <input type="range" id="strokeSize" min="0" max="6" value="2" oninput="updateStyles()">
    </div>
    <div class="control-group">
        <label>حجم خط الفصل: <span id="gradeSizeVal">20</span>pt</label>
        <input type="range" id="gradeSize" min="14" max="30" value="20" oninput="updateStyles()">
    </div>
    <div class="control-group">
        <label>لون خط الاسم:</label>
        <input type="color" id="nameColor" value="#ffffff" onchange="updateStyles()">
    </div>
    <div class="control-group">
        <label>لون خلفية شارة الفصل:</label>
        <input type="color" id="gradeBgColor" value="#fef08a" onchange="updateStyles()">
    </div>
    <button class="print-btn" onclick="window.print()">🖨️ طباعة جميع الاستيكرات (كل استيكر في صفحة)</button>
</div>

<div id="pagesContainer"></div>

<script>
    // الخلفيات الـ 10 المستوحاة من تصميمك (بدون شعار برشلونة)
    const backgrounds = [
        'linear-gradient(rgba(0,0,0,0.3), rgba(0,0,0,0.5)), url("https://images.unsplash.com/photo-1518709268805-4e9042af9f23?w=1000")',
        'linear-gradient(rgba(0,0,0,0.3), rgba(0,0,0,0.5)), url("https://images.unsplash.com/photo-1550745165-9bc0b252726f?w=1000")',
        'linear-gradient(rgba(0,0,0,0.3), rgba(0,0,0,0.5)), url("https://images.unsplash.com/photo-1578632767115-351597cf2477?w=1000")',
        'linear-gradient(135deg, #FF6B6B, #FF8E53)',
        'linear-gradient(135deg, #4E65FF, #92EFFD)',
        'linear-gradient(135deg, #11998e, #38ef7d)',
        'linear-gradient(135deg, #8A2387, #E94057, #F27121)',
        'linear-gradient(135deg, #00c6ff, #0072ff)',
        'linear-gradient(135deg, #7F00FF, #E100FF)',
        'linear-gradient(135deg, #FF416C, #FF4B2B)'
    ];

    const container = document.getElementById('pagesContainer');

    backgrounds.forEach((bg) => {
        container.innerHTML += `
            <div class="page">
                <div class="sticker" style="background: ${bg}; background-size: cover; background-position: center;">
                    <div class="content">
                        <div class="avatar-container">
                            <img class="child-avatar" src="https://images.unsplash.com/photo-1543332164-6e82f355badc?auto=format&fit=crop&w=600&q=80" alt="صورة الطفل">
                        </div>
                        <div class="text-box">
                            <div class="student-name target-name">MOHAMED SAMEH</div>
                            <div class="grade-badge target-grade">G 4B</div>
                        </div>
                    </div>
                </div>
            </div>
        `;
    });

    function updateStyles() {
        const nameVal = document.getElementById('nameInput').value;
        const gradeVal = document.getElementById('gradeInput').value;
        const fontVal = document.getElementById('fontFamily').value;
        const nameSizeVal = document.getElementById('nameSize').value;
        const strokeSizeVal = document.getElementById('strokeSize').value;
        const gradeSizeVal = document.getElementById('gradeSize').value;
        const colorVal = document.getElementById('nameColor').value;
        const gradeBgVal = document.getElementById('gradeBgColor').value;

        document.getElementById('nameSizeVal').textContent = nameSizeVal;
        document.getElementById('strokeSizeVal').textContent = strokeSizeVal;
        document.getElementById('gradeSizeVal').textContent = gradeSizeVal;

        document.querySelectorAll('.target-name').forEach(el => {
            el.textContent = nameVal;
            el.style.fontFamily = fontVal;
            el.style.fontSize = nameSizeVal + 'pt';
            el.style.color = colorVal;
            
            if (strokeSizeVal > 0) {
                el.style.textShadow = `
                    -${strokeSizeVal}px -${strokeSizeVal}px 0 #000,
                    ${strokeSizeVal}px -${strokeSizeVal}px 0 #000,
                    -${strokeSizeVal}px ${strokeSizeVal}px 0 #000,
                    ${strokeSizeVal}px ${strokeSizeVal}px 0 #000,
                    0px ${strokeSizeVal}px 0 #000,
                    0px -${strokeSizeVal}px 0 #000,
                    ${strokeSizeVal}px 0px 0 #000,
                    -${strokeSizeVal}px 0px 0 #000
                `;
            } else {
                el.style.textShadow = 'none';
            }
        });

        document.querySelectorAll('.target-grade').forEach(el => {
            el.textContent = gradeVal;
            el.style.fontFamily = fontVal;
            el.style.fontSize = gradeSizeVal + 'pt';
            el.style.background = gradeBgVal;
            el.style.color = '#1e293b';
        });
    }

    updateStyles();
</script>

</body>
</html>

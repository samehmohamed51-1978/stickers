<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>استوديو تصميم استيكرات الأطفال المتقدم</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;900&family=Tajawal:wght@700;900&family=Amiri:wght@700&family=Changa:wght@700&display=swap" rel="stylesheet">
    <style>
        @page {
            size: A4 portrait;
            margin: 5mm;
        }
        body {
            font-family: 'Cairo', Tahoma, sans-serif;
            background-color: #0f172a;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #f8fafc;
        }
        .control-panel {
            background: #1e293b;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            max-width: 1000px;
            width: 100%;
            margin-bottom: 25px;
            border: 1px solid #334155;
        }
        .control-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        .control-group label {
            font-size: 12px;
            font-weight: bold;
            color: #94a3b8;
        }
        .checkbox-group {
            flex-direction: row;
            align-items: center;
            gap: 10px;
            cursor: pointer;
        }
        .checkbox-group input {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }
        input[type="text"], select, input[type="color"], input[type="range"] {
            padding: 8px 12px;
            border: 1px solid #475569;
            background: #0f172a;
            color: white;
            border-radius: 6px;
            font-family: 'Cairo', Tahoma, sans-serif;
        }
        .file-btn {
            background: #2563eb;
            color: white;
            padding: 8px 15px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 13px;
            text-align: center;
            display: inline-block;
        }
        .file-btn:hover { background: #1d4ed8; }
        
        .print-btn {
            background: #16a34a;
            color: white;
            border: none;
            padding: 10px 25px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            font-size: 14px;
            font-family: 'Cairo', Tahoma, sans-serif;
            grid-column: 1 / -1;
            transition: background 0.2s;
        }
        .print-btn:hover { background: #15803d; }

        .page {
            width: 200mm;
            height: 287mm;
            background: white;
            display: flex;
            flex-wrap: wrap;
            align-content: space-between;
            justify-content: space-between;
            box-sizing: border-box;
            box-shadow: 0 0 20px rgba(0,0,0,0.3);
            padding: 5mm;
        }
        .sticker {
            width: 93mm;
            height: 52mm;
            border-radius: 12px;
            overflow: hidden;
            position: relative;
            box-sizing: border-box;
            border: 2px dashed #94a3b8;
            background-size: cover;
            background-position: center;
        }

        .content {
            position: absolute;
            top: 0; right: 0; bottom: 0; left: 0;
            padding: 8px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            z-index: 2;
        }

        .avatar-container {
            width: 38mm;
            height: 38mm;
            border-radius: 50%;
            border: 3px solid #ffffff;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            overflow: hidden;
            background: #ffffff;
            flex-shrink: 0;
            transition: all 0.3s ease;
        }
        
        .avatar-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .text-box {
            flex-grow: 1;
            text-align: right;
            margin-right: 12px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 6px;
        }

        .student-name {
            font-weight: 900;
            margin: 0;
            line-height: 1.1;
            transition: all 0.1s;
        }

        .grade-badge {
            display: inline-block;
            font-weight: 900;
            padding: 4px 12px;
            border-radius: 8px;
            text-align: center;
            align-self: flex-end;
            box-shadow: 0 2px 5px rgba(0,0,0,0.15);
            transition: all 0.1s;
        }

        @media print {
            body { background: none; padding: 0; }
            .control-panel { display: none; }
            .page { box-shadow: none; margin: 0; }
        }
    </style>
</head>
<body>

<div class="control-panel">
    <div class="control-group">
        <label>اسم الطفل:</label>
        <input type="text" id="nameInput" value="MOHAMED SAMEH" oninput="updateStyles()">
    </div>
    <div class="control-group">
        <label>الفصل / المرحلة:</label>
        <input type="text" id="gradeInput" value="G 4B" oninput="updateStyles()">
    </div>
    <div class="control-group">
        <label>صورة الطفل الشخصية:</label>
        <label for="imageUpload" class="file-btn">📁 اختر صورة الطفل</label>
        <input type="file" id="imageUpload" accept="image/*" style="display: none;">
    </div>
    <div class="control-group">
        <label>خلفية الاستيكرات:</label>
        <label for="bgUpload" class="file-btn" style="background: #7c3aed;">🖼️ اختر خلفية كرتونية</label>
        <input type="file" id="bgUpload" accept="image/*" style="display: none;">
    </div>
    <div class="control-group">
        <label>نوع الخط:</label>
        <select id="fontFamily" onchange="updateStyles()">
            <option value="'Cairo', sans-serif">Cairo (عصري)</option>
            <option value="'Tajawal', sans-serif">Tajawal (رسمي)</option>
            <option value="'Changa', sans-serif">Changa (عريض)</option>
            <option value="'Amiri', serif">Amiri (تقليدي)</option>
        </select>
    </div>
    <div class="control-group">
        <label>حجم خط الاسم: <span id="nameSizeVal">13</span>pt</label>
        <input type="range" id="nameSize" min="9" max="20" value="13" oninput="updateStyles()">
    </div>
    <div class="control-group">
        <label>سمك حدود الاسم البيضاء: <span id="strokeSizeVal">1</span>px</label>
        <input type="range" id="strokeSize" min="0" max="4" value="1" oninput="updateStyles()">
    </div>
    <div class="control-group">
        <label>حجم خط الفصل: <span id="gradeSizeVal">10</span>pt</label>
        <input type="range" id="gradeSize" min="8" max="16" value="10" oninput="updateStyles()">
    </div>
    <div class="control-group">
        <label>لون خط الاسم الداخلي:</label>
        <input type="color" id="nameColor" value="#ffffff" onchange="updateStyles()">
    </div>
    <div class="control-group">
        <label>لون خلفية شارة الفصل:</label>
        <input type="color" id="gradeBgColor" value="#fef08a" onchange="updateStyles()">
    </div>
    <div class="control-group checkbox-group" style="grid-column: span 2;">
        <input type="checkbox" id="showAvatarToggle" checked onchange="updateStyles()">
        <label for="showAvatarToggle" style="color: #f8fafc; font-size: 14px; cursor: pointer;">إظهار مكان وصورة الطفل</label>
    </div>
    <button class="print-btn" onclick="window.print()">🖨️ طباعة لوحة الاستيكرات (A4)</button>
</div>

<div class="page" id="stickersContainer"></div>

<script>
    const defaultBgs = [
        'linear-gradient(135deg, #FF6B6B, #FF8E53)',
        'linear-gradient(135deg, #4E65FF, #92EFFD)',
        'linear-gradient(135deg, #11998e, #38ef7d)',
        'linear-gradient(135deg, #F2994A, #F2C94C)',
        'linear-gradient(135deg, #8A2387, #E94057, #F27121)',
        'linear-gradient(135deg, #00c6ff, #0072ff)',
        'linear-gradient(135deg, #f7ff00, #db36a4)',
        'linear-gradient(135deg, #0ba360, #3cba92)',
        'linear-gradient(135deg, #FF416C, #FF4B2B)',
        'linear-gradient(135deg, #7F00FF, #E100FF)'
    ];

    const container = document.getElementById('stickersContainer');

    defaultBgs.forEach((bg) => {
        container.innerHTML += `
            <div class="sticker" style="background: ${bg};">
                <div class="content">
                    <div class="avatar-container target-avatar-box">
                        <img class="child-avatar" src="https://images.unsplash.com/photo-1543332164-6e82f355badc?auto=format&fit=crop&w=400&q=80" alt="صورة الطفل">
                    </div>
                    <div class="text-box">
                        <div class="student-name target-name">MOHAMED SAMEH</div>
                        <div class="grade-badge target-grade">G 4B</div>
                    </div>
                </div>
            </div>
        `;
    });

    function updateStyles() {
        const nameVal = document.getElementById('nameInput').value;
        const gradeVal = document.getElementById('gradeInput').value;
        const fontVal = document.getElementById('fontFamily').value;
        const nameSizeVal = document.getElementById('nameSize').value;
        const strokeSizeVal = document.getElementById('strokeSize').value;
        const gradeSizeVal = document.getElementById('gradeSize').value;
        const colorVal = document.getElementById('nameColor').value;
        const gradeBgVal = document.getElementById('gradeBgColor').value;
        const showAvatar = document.getElementById('showAvatarToggle').checked;

        document.getElementById('nameSizeVal').textContent = nameSizeVal;
        document.getElementById('strokeSizeVal').textContent = strokeSizeVal;
        document.getElementById('gradeSizeVal').textContent = gradeSizeVal;

        // إخفاء أو إظهار صندوق الصورة
        document.querySelectorAll('.target-avatar-box').forEach(el => {
            if (showAvatar) {
                el.style.display = 'block';
                el.style.width = '38mm';
                el.style.opacity = '1';
                el.style.marginRight = '0';
            } else {
                el.style.display = 'none';
                el.style.width = '0';
                el.style.opacity = '0';
                el.style.marginRight = '0';
            }
        });

        document.querySelectorAll('.target-name').forEach(el => {
            el.textContent = nameVal;
            el.style.fontFamily = fontVal;
            el.style.fontSize = nameSizeVal + 'pt';
            el.style.color = colorVal;
            
            if (strokeSizeVal > 0) {
                el.style.textShadow = `
                    -${strokeSizeVal}px -${strokeSizeVal}px 0 #000,
                    ${strokeSizeVal}px -${strokeSizeVal}px 0 #000,
                    -${strokeSizeVal}px ${strokeSizeVal}px 0 #000,
                    ${strokeSizeVal}px ${strokeSizeVal}px 0 #000,
                    0px ${strokeSizeVal}px 0 #000,
                    0px -${strokeSizeVal}px 0 #000,
                    ${strokeSizeVal}px 0px 0 #000,
                    -${strokeSizeVal}px 0px 0 #000
                `;
            } else {
                el.style.textShadow = 'none';
            }
        });

        document.querySelectorAll('.target-grade').forEach(el => {
            el.textContent = gradeVal;
            el.style.fontFamily = fontVal;
            el.style.fontSize = gradeSizeVal + 'pt';
            el.style.background = gradeBgVal;
            el.style.color = '#1e293b';
        });
    }

    document.getElementById('imageUpload').addEventListener('change', function(event) {
        const file = event.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                document.querySelectorAll('.child-avatar').forEach(img => {
                    img.src = e.target.result;
                });
            }
            reader.readAsDataURL(file);
        }
    });

    document.getElementById('bgUpload').addEventListener('change', function(event) {
        const file = event.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                const bgUrl = e.target.result;
                document.querySelectorAll('.sticker').hasBg = true;
                document.querySelectorAll('.sticker').forEach(sticker => {
                    sticker.style.background = `url("${bgUrl}")`;
                    sticker.style.backgroundSize = 'cover';
                    sticker.style.backgroundPosition = 'center';
                });
            }
            reader.readAsDataURL(file);
        }
    });

    updateStyles();
</script>

</body>
</html>

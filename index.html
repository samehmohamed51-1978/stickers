<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>استوديو تصميم استيكرات الأطفال المتقدم</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;900&family=Tajawal:wght@700;900&family=Amiri:wght@700&family=Changa:wght@700&display=swap" rel="stylesheet">
    <style>
        @page {
            size: A4 portrait;
            margin: 5mm;
        }
        body {
            font-family: 'Cairo', Tahoma, sans-serif;
            background-color: #0f172a;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #f8fafc;
        }
        .control-panel {
            background: #1e293b;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            max-width: 1000px;
            width: 100%;
            margin-bottom: 25px;
            border: 1px solid #334155;
        }
        .control-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        .control-group label {
            font-size: 12px;
            font-weight: bold;
            color: #94a3b8;
        }
        input[type="text"], select, input[type="color"], input[type="range"] {
            padding: 8px 12px;
            border: 1px solid #475569;
            background: #0f172a;
            color: white;
            border-radius: 6px;
            font-family: 'Cairo', Tahoma, sans-serif;
        }
        .file-btn {
            background: #2563eb;
            color: white;
            padding: 8px 15px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 13px;
            text-align: center;
            display: inline-block;
        }
        .file-btn:hover { background: #1d4ed8; }
        
        .print-btn {
            background: #16a34a;
            color: white;
            border: none;
            padding: 10px 25px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            font-size: 14px;
            font-family: 'Cairo', Tahoma, sans-serif;
            grid-column: 1 / -1;
            transition: background 0.2s;
        }
        .print-btn:hover { background: #15803d; }

        .page {
            width: 200mm;
            height: 287mm;
            background: white;
            display: flex;
            flex-wrap: wrap;
            align-content: space-between;
            justify-content: space-between;
            box-sizing: border-box;
            box-shadow: 0 0 20px rgba(0,0,0,0.3);
        }
        .sticker {
            width: 98.5mm;
            height: 55.5mm;
            border-radius: 6px;
            overflow: hidden;
            position: relative;
            box-sizing: border-box;
            border: 1px dashed #94a3b8;
            background-size: cover;
            background-position: center;
        }

        .content {
            position: absolute;
            top: 0; right: 0; bottom: 0; left: 0;
            padding: 6px 10px;
        }

        .avatar-container {
            position: absolute;
            left: 10px;
            bottom: 6px;
            width: 44mm;
            height: 44mm;
            border-radius: 50%;
            border: 2px solid #fbbf24;
            overflow: hidden;
            background: #334155;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2;
        }
        
        .avatar-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .text-box {
            position: absolute;
            right: 10px;
            top: 6px;
            bottom: 6px;
            left: 56mm;
            text-align: right;
            display: flex;
            flex-direction: column;
            justify-content: center;
            z-index: 2;
        }

        .student-name {
            font-weight: 900;
            margin: 0 0 3px 0;
            line-height: 1.1;
            transition: all 0.1s;
        }

        .grade-badge {
            display: inline-block;
            font-weight: 900;
            padding: 2px 10px;
            border-radius: 6px;
            text-align: center;
            align-self: flex-end;
            transition: all 0.1s;
        }

        @media print {
            body { background: none; padding: 0; }
            .control-panel { display: none; }
            .page { box-shadow: none; margin: 0; }
        }
    </style>
</head>
<body>

<div class="control-panel">
    <div class="control-group">
        <label>اسم الطفل:</label>
        <input type="text" id="nameInput" value="MOHAMED SAMEH" oninput="updateStyles()">
    </div>
    <div class="control-group">
        <label>الفصل / المرحلة:</label>
        <input type="text" id="gradeInput" value="G 4B" oninput="updateStyles()">
    </div>
    <div class="control-group">
        <label>صورة الطفل الشخصية:</label>
        <label for="imageUpload" class="file-btn">📁 اختر صورة الطفل</label>
        <input type="file" id="imageUpload" accept="image/*" style="display: none;">
    </div>
    <div class="control-group">
        <label>نوع الخط:</label>
        <select id="fontFamily" onchange="updateStyles()">
            <option value="'Cairo', sans-serif">Cairo (عصري)</option>
            <option value="'Tajawal', sans-serif">Tajawal (رسمي)</option>
            <option value="'Changa', sans-serif">Changa (عريض)</option>
            <option value="'Amiri', serif">Amiri (تقليدي)</option>
        </select>
    </div>
    <div class="control-group">
        <label>حجم خط الاسم: <span id="nameSizeVal">13</span>pt</label>
        <input type="range" id="nameSize" min="9" max="20" value="13" oninput="updateStyles()">
    </div>
    <div class="control-group">
        <label>حجم خط الفصل: <span id="gradeSizeVal">10</span>pt</label>
        <input type="range" id="gradeSize" min="8" max="16" value="10" oninput="updateStyles()">
    </div>
    <div class="control-group">
        <label>لون خط الاسم:</label>
        <input type="color" id="nameColor" value="#ffffff" onchange="updateStyles()">
    </div>
    <div class="control-group">
        <label>لون خلفية شارة الفصل:</label>
        <input type="color" id="gradeBgColor" value="#fef08a" onchange="updateStyles()">
    </div>
    <button class="print-btn" onclick="window.print()">🖨️ طباعة لوحة الاستيكرات (A4)</button>
</div>

<div class="page" id="stickersContainer"></div>

<script>
    // 10 خلفيات ملونة وتدرجات كرتونية مبهجة ومختلفة لكل استيكر تظهر فوراً
    const stickersData = [
        { bg: 'linear-gradient(135deg, #1e40af 0%, #3b82f6 100%)' }, // أزرق ملكي
        { bg: 'linear-gradient(135deg, #7c3aed 0%, #a855f7 100%)' }, // بنفسجي روبلوكس
        { bg: 'linear-gradient(135deg, #09090b 0%, #3f3f46 100%)' }, // فضاء داكن نجومي
        { bg: 'linear-gradient(135deg, #b91c1c 0%, #ef4444 100%)' }, // أحمر برشلونة قوية
        { bg: 'linear-gradient(135deg, #047857 0%, #10b981 100%)' }, // أخضر مبهج
        { bg: 'linear-gradient(135deg, #c2410c 0%, #f97316 100%)' }, // برتقالي ساطع
        { bg: 'linear-gradient(135deg, #4f46e5 0%, #818cf8 100%)' }, // أزرق ناصع
        { bg: 'linear-gradient(135deg, #be185d 0%, #ec4899 100%)' }, // وردي كرتوني
        { bg: 'linear-gradient(135deg, #854d0e 0%, #eab308 100%)' }, // أصفر ذهبي
        { bg: 'linear-gradient(135deg, #312e81 0%, #4338ca 100%)' }  // كحلي غامق
    ];

    const container = document.getElementById('stickersContainer');

    stickersData.forEach((item) => {
        container.innerHTML += `
            <div class="sticker" style="background: ${item.bg};">
                <div class="content">
                    <div class="avatar-container">
                        <img class="child-avatar" src="https://images.unsplash.com/photo-1543332164-6e82f355badc?auto=format&fit=crop&w=400&q=80" alt="صورة الطفل">
                    </div>
                    <div class="text-box">
                        <div class="student-name target-name">MOHAMED SAMEH</div>
                        <div class="grade-badge target-grade">G 4B</div>
                    </div>
                </div>
            </div>
        `;
    });

    function updateStyles() {
        const nameVal = document.getElementById('nameInput').value;
        const gradeVal = document.getElementById('gradeInput').value;
        const fontVal = document.getElementById('fontFamily').value;
        const nameSizeVal = document.getElementById('nameSize').value;
        const gradeSizeVal = document.getElementById('gradeSize').value;
        const colorVal = document.getElementById('nameColor').value;
        const gradeBgVal = document.getElementById('gradeBgColor').value;

        document.getElementById('nameSizeVal').textContent = nameSizeVal;
        document.getElementById('gradeSizeVal').textContent = gradeSizeVal;

        document.querySelectorAll('.target-name').forEach(el => {
            el.textContent = nameVal;
            el.style.fontFamily = fontVal;
            el.style.fontSize = nameSizeVal + 'pt';
            el.style.color = colorVal;
        });

        document.querySelectorAll('.target-grade').forEach(el => {
            el.textContent = gradeVal;
            el.style.fontFamily = fontVal;
            el.style.fontSize = gradeSizeVal + 'pt';
            el.style.background = gradeBgVal;
            el.style.color = '#1e293b';
        });
    }

    document.getElementById('imageUpload').addEventListener('change', function(event) {
        const file = event.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                const imageUrl = e.target.result;
                document.querySelectorAll('.child-avatar').forEach(img => {
                    img.src = imageUrl;
                });
            }
            reader.readAsDataURL(file);
        }
    });

    updateStyles();
</script>

</body>
</html>

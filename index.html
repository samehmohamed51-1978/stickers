<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>استوديو تصميم استيكرات الأطفال المتقدم</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;900&family=Tajawal:wght@700;900&family=Amiri:wght@700&family=Changa:wght@700&display=swap" rel="stylesheet">
    <style>
        @page {
            size: A4 portrait;
            margin: 5mm;
        }
        body {
            font-family: 'Cairo', Tahoma, sans-serif;
            background-color: #0f172a;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #f8fafc;
        }
        .control-panel {
            background: #1e293b;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            max-width: 1000px;
            width: 100%;
            margin-bottom: 25px;
            border: 1px solid #334155;
        }
        .control-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        .control-group label {
            font-size: 12px;
            font-weight: bold;
            color: #94a3b8;
        }
        input[type="text"], select, input[type="color"], input[type="range"] {
            padding: 8px 12px;
            border: 1px solid #475569;
            background: #0f172a;
            color: white;
            border-radius: 6px;
            font-family: 'Cairo', Tahoma, sans-serif;
        }
        .file-btn {
            background: #2563eb;
            color: white;
            padding: 8px 15px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 13px;
            text-align: center;
            display: inline-block;
        }
        .file-btn:hover { background: #1d4ed8; }
        
        .print-btn {
            background: #16a34a;
            color: white;
            border: none;
            padding: 10px 25px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            font-size: 14px;
            font-family: 'Cairo', Tahoma, sans-serif;
            grid-column: 1 / -1;
            transition: background 0.2s;
        }
        .print-btn:hover { background: #15803d; }

        .page {
            width: 200mm;
            height: 287mm;
            background: white;
            display: flex;
            flex-wrap: wrap;
            align-content: space-between;
            justify-content: space-between;
            box-sizing: border-box;
            box-shadow: 0 0 20px rgba(0,0,0,0.3);
            padding: 5mm;
        }
        .sticker {
            width: 93mm;
            height: 52mm;
            border-radius: 12px;
            overflow: hidden;
            position: relative;
            box-sizing: border-box;
            border: 2px dashed #94a3b8;
        }

        /* رسومات كرتونية خلفية داخلية مضمنة تظهر فوراً بجودة عالية */
        .cartoon-bg {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            opacity: 0.18;
            z-index: 1;
            pointer-events: none;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .cartoon-bg svg {
            width: 80mm;
            height: 45mm;
        }

        .content {
            position: absolute;
            top: 0; right: 0; bottom: 0; left: 0;
            padding: 8px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            z-index: 2;
        }

        .avatar-container {
            width: 38mm;
            height: 38mm;
            border-radius: 50%;
            border: 3px solid #ffffff;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            overflow: hidden;
            background: #ffffff;
            flex-shrink: 0;
        }
        
        .avatar-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .text-box {
            flex-grow: 1;
            text-align: right;
            margin-right: 12px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 6px;
        }

        .student-name {
            font-weight: 900;
            margin: 0;
            line-height: 1.1;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.3);
            transition: all 0.1s;
        }

        .grade-badge {
            display: inline-block;
            font-weight: 900;
            padding: 4px 12px;
            border-radius: 8px;
            text-align: center;
            align-self: flex-end;
            box-shadow: 0 2px 5px rgba(0,0,0,0.15);
            transition: all 0.1s;
        }

        @media print {
            body { background: none; padding: 0; }
            .control-panel { display: none; }
            .page { box-shadow: none; margin: 0; }
        }
    </style>
</head>
<body>

<div class="control-panel">
    <div class="control-group">
        <label>اسم الطفل:</label>
        <input type="text" id="nameInput" value="MOHAMED SAMEH" oninput="updateStyles()">
    </div>
    <div class="control-group">
        <label>الفصل / المرحلة:</label>
        <input type="text" id="gradeInput" value="G 4B" oninput="updateStyles()">
    </div>
    <div class="control-group">
        <label>صورة الطفل الشخصية:</label>
        <label for="imageUpload" class="file-btn">📁 اختر صورة الطفل</label>
        <input type="file" id="imageUpload" accept="image/*" style="display: none;">
    </div>
    <div class="control-group">
        <label>نوع الخط:</label>
        <select id="fontFamily" onchange="updateStyles()">
            <option value="'Cairo', sans-serif">Cairo (عصري)</option>
            <option value="'Tajawal', sans-serif">Tajawal (رسمي)</option>
            <option value="'Changa', sans-serif">Changa (عريض)</option>
            <option value="'Amiri', serif">Amiri (تقليدي)</option>
        </select>
    </div>
    <div class="control-group">
        <label>حجم خط الاسم: <span id="nameSizeVal">13</span>pt</label>
        <input type="range" id="nameSize" min="9" max="20" value="13" oninput="updateStyles()">
    </div>
    <div class="control-group">
        <label>حجم خط الفصل: <span id="gradeSizeVal">10</span>pt</label>
        <input type="range" id="gradeSize" min="8" max="16" value="10" oninput="updateStyles()">
    </div>
    <div class="control-group">
        <label>لون خط الاسم:</label>
        <input type="color" id="nameColor" value="#ffffff" onchange="updateStyles()">
    </div>
    <div class="control-group">
        <label>لون خلفية شارة الفصل:</label>
        <input type="color" id="gradeBgColor" value="#fef08a" onchange="updateStyles()">
    </div>
    <button class="print-btn" onclick="window.print()">🖨️ طباعة لوحة الاستيكرات (A4)</button>
</div>

<div class="page" id="stickersContainer"></div>

<script>
    // تصميمات خلفيات كرتونية وأشكال مبهجة مصممة داخليةً (لا تعتمد على صور خارجية)
    const stickersData = [
        { 
          bg: 'linear-gradient(135deg, #FF6B6B, #FF8E53)', 
          svg: '<svg viewBox="0 0 100 100"><polygon points="50,5 61,35 95,35 68,55 79,85 50,70 21,85 32,55 5,35 39,35" fill="#fff"/></svg>' 
        }, // نجوم كرتونية
        { 
          bg: 'linear-gradient(135deg, #4E65FF, #92EFFD)', 
          svg: '<svg viewBox="0 0 100 100"><circle cx="30" cy="40" r="20" fill="#fff"/><circle cx="70" cy="60" r="25" fill="#fff"/></svg>' 
        }, // سحب كرتونية
        { 
          bg: 'linear-gradient(135deg, #11998e, #38ef7d)', 
          svg: '<svg viewBox="0 0 100 100"><path d="M50,20 C30,0 0,30 30,60 L50,85 L70,60 C100,30 70,0 50,20 Z" fill="#fff"/></svg>' 
        }, // قلوب مبهجة
        { 
          bg: 'linear-gradient(135deg, #F2994A, #F2C94C)', 
          svg: '<svg viewBox="0 0 100 100"><rect x="25" y="25" width="50" height="50" rx="10" fill="#fff"/><circle cx="50" cy="50" r="15" fill="#F2994A"/></svg>' 
        }, // مربعات ألعاب
        { 
          bg: 'linear-gradient(135deg, #8A2387, #E94057, #F27121)', 
          svg: '<svg viewBox="0 0 100 100"><path d="M20,80 Q50,10 80,80 Z" fill="#fff"/></svg>' 
        }, // أشكال هندسية طفولية
        { 
          bg: 'linear-gradient(135deg, #00c6ff, #0072ff)', 
          svg: '<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="35" fill="none" stroke="#fff" stroke-width="8"/><circle cx="50" cy="50" r="15" fill="#fff"/></svg>' 
        }, // دوائر وأهداف
        { 
          bg: 'linear-gradient(135deg, #f7ff00, #db36a4)', 
          svg: '<svg viewBox="0 0 100 100"><polygon points="50,10 90,90 10,90" fill="#fff"/></svg>' 
        }, // مثلثات مضحكة
        { 
          bg: 'linear-gradient(135deg, #0ba360, #3cba92)', 
          svg: '<svg viewBox="0 0 100 100"><circle cx="30" cy="50" r="15" fill="#fff"/><circle cx="70" cy="50" r="15" fill="#fff"/><rect x="40" y="35" width="20" height="30" fill="#fff"/></svg>' 
        }, // أيقونات كرتونية
        { 
          bg: 'linear-gradient(135deg, #FF416C, #FF4B2B)', 
          svg: '<svg viewBox="0 0 100 100"><path d="M20,50 Q50,20 80,50 Q50,80 20,50 Z" fill="#fff"/></svg>' 
        }, // فقاعات مرحة
        { 
          bg: 'linear-gradient(135deg, #7F00FF, #E100FF)', 
          svg: '<svg viewBox="0 0 100 100"><polygon points="50,5 61,35 95,35 68,55 79,85 50,70 21,85 32,55 5,35 39,35" fill="#fff"/></svg>' 
        }  // نجوم
    ];

    const container = document.getElementById('stickersContainer');

    stickersData.forEach((item) => {
        container.innerHTML += `
            <div class="sticker" style="background: ${item.bg};">
                <div class="cartoon-bg">${item.svg}</div>
                <div class="content">
                    <div class="avatar-container">
                        <img class="child-avatar" src="https://images.unsplash.com/photo-1543332164-6e82f355badc?auto=format&fit=crop&w=400&q=80" alt="صورة الطفل">
                    </div>
                    <div class="text-box">
                        <div class="student-name target-name">MOHAMED SAMEH</div>
                        <div class="grade-badge target-grade">G 4B</div>
                    </div>
                </div>
            </div>
        `;
    });

    function updateStyles() {
        const nameVal = document.getElementById('nameInput').value;
        const gradeVal = document.getElementById('gradeInput').value;
        const fontVal = document.getElementById('fontFamily').value;
        const nameSizeVal = document.getElementById('nameSize').value;
        const gradeSizeVal = document.getElementById('gradeSize').value;
        const colorVal = document.getElementById('nameColor').value;
        const gradeBgVal = document.getElementById('gradeBgColor').value;

        document.getElementById('nameSizeVal').textContent = nameSizeVal;
        document.getElementById('gradeSizeVal').textContent = gradeSizeVal;

        document.querySelectorAll('.target-name').forEach(el => {
            el.textContent = nameVal;
            el.style.fontFamily = fontVal;
            el.style.fontSize = nameSizeVal + 'pt';
            el.style.color = colorVal;
        });

        document.querySelectorAll('.target-grade').forEach(el => {
            el.textContent = gradeVal;
            el.style.fontFamily = fontVal;
            el.style.fontSize = gradeSizeVal + 'pt';
            el.style.background = gradeBgVal;
            el.style.color = '#1e293b';
        });
    }

    document.getElementById('imageUpload').addEventListener('change', function(event) {
        const file = event.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                const imageUrl = e.target.result;
                document.querySelectorAll('.child-avatar').forEach(img => {
                    img.src = imageUrl;
                });
            }
            reader.readAsDataURL(file);
        }
    });

    updateStyles();
</script>

</body>
</html>
